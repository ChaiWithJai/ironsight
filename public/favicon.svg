    <path d="M16 5v6"/>
    <path d="M16 21v6"/>
    <path d="M5 16h6"/>
    <path d="M21 16h6"/>
  </g>
  <circle cx="16" cy="16" r="1.6" fill="#8ff0ff"/>
</svg>
