<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IRONSIGHT</title>

    <!-- Social preview. og:image MUST be an absolute URL — crawlers do not resolve
         relative paths, and vite's base:'./' makes every built path relative. If you
         deploy to a different host, change the three absolute URLs below (og:url, og:image, twitter:image). -->
    <meta name="description" content="A browser-native first-person shooter built on Three.js. Every texture, mesh, sound and font is generated procedurally at load — the game ships zero binary art assets." />
    <meta name="theme-color" content="#05070a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./app.css" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IRONSIGHT" />
    <meta property="og:title" content="IRONSIGHT — a browser FPS with zero art assets" />
    <meta property="og:description" content="One map, Conquest, bots, destructible cover. Every texture, mesh, sound and font is generated procedurally in the browser at load time." />
    <meta property="og:url" content="https://ironsight-tan.vercel.app/" />
    <meta property="og:image" content="https://ironsight-tan.vercel.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="733" />
    <meta property="og:image:alt" content="First-person view across a ruined Mediterranean harbour town at golden hour, with a full combat HUD: ticket bars, objective markers, minimap and ammo counter." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IRONSIGHT — a browser FPS with zero art assets" />
    <meta name="twitter:description" content="One map, Conquest, bots, destructible cover. Every texture, mesh, sound and font is generated procedurally in the browser at load time." />
    <meta name="twitter:image" content="https://ironsight-tan.vercel.app/og.jpg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
